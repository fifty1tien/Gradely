        transform: rotate(42deg) scale(1.15);

      .card {
        width: min(100%, 430px);
        padding: 30px;
        overflow: hidden;
        position: relative;
        z-index: 1;
        isolation: isolate;
        background:
          radial-gradient(
            ellipse at 8% 0%,
            rgba(125, 240, 209, 0.12),
            transparent 42%
          ),
          repeating-linear-gradient(
            135deg,
            rgba(209, 255, 248, 0.024) 0 1px,
            transparent 1px 7px
          ),
          repeating-linear-gradient(
            45deg,
            rgba(209, 255, 248, 0.012) 0 1px,
            transparent 1px 9px
          ),
          linear-gradient(145deg, #0c1a2a, #0d2225);
        border: 1px solid rgba(125, 240, 209, 0.18);
        border-radius: 22px;
        box-shadow:
          0 24px 70px rgba(0, 0, 0, 0.5),
          0 0 18px rgba(69, 221, 184, 0.14),
          0 0 34px rgba(66, 189, 195, 0.07);
        animation:
          pop-in 0.6s ease-out both,
          aurora-pulse 5s ease-in-out infinite 0.6s;
      }

      .card::after {
        content: "";
        position: absolute;
        inset: 0;
        z-index: 0;
        pointer-events: none;
        border-radius: inherit;
        background: linear-gradient(
          112deg,
          transparent 39%,
          rgba(255, 255, 255, 0.04) 46%,
          rgba(125, 240, 209, 0.2) 50%,
          rgba(255, 255, 255, 0.05) 54%,
          transparent 62%
        );
        opacity: 0;
        transform: translateX(-105%);
        animation: card-light-sweep 10s ease-in-out infinite;
      }

      .card > * {
        position: relative;
        z-index: 1;
      }

      .eyebrow {
        display: inline-flex;
        align-items: center;
        gap: 7px;
        margin: 4px 0 12px;
        color: var(--teal);
        font-size: 12px;
        font-weight: 800;
        letter-spacing: 1.3px;
        text-transform: uppercase;
      }

      .sparkle {
        display: inline-block;
        color: var(--coral);
        font-size: 17px;
        animation: sparkle-drift 3.6s ease-in-out infinite;
      }

      h1 {
        margin: 0;
        display: flex;
        flex-wrap: wrap;
        column-gap: 0.3em;
        row-gap: 0.08em;
        font-weight: 400;
        font-size: 38px;
        text-transform: uppercase;
        line-height: 1.12;
        -webkit-text-stroke: 1.2px #000;
        paint-order: stroke fill;
        animation: title-breathe 6s ease-in-out infinite;
        transition:
          color 0.2s,
          text-shadow 0.2s;
      }

      .title-urban {
        font-family: "Urban Thunder", "Oxanium", "Segoe UI", sans-serif;
      }

      .title-shock {
        font-family: "Barlow Condensed", "Oxanium", "Segoe UI", sans-serif;
        font-style: italic;
        font-weight: 700;
      }

      .title-word {
        display: inline-flex;
        white-space: nowrap;
      }

      h1:hover {
        color: #ffffff;
        text-shadow: 0 0 18px rgba(125, 240, 209, 0.28);
      }

      .intro {
        margin: 10px 0 25px;
        color: var(--muted);
        font-size: 14px;
        line-height: 1.6;
      }

      .field {
        margin-top: 16px;
      }

      label {
        display: flex;
        align-items: center;
        gap: 9px;
        margin-bottom: 7px;
        font-size: 14px;
        font-weight: 700;
      }

      .field-number {
        width: 26px;
        height: 26px;
        display: inline-grid;
        place-items: center;
        border-radius: 9px;
        color: #fff;
        font-size: 12px;
        transition:
          transform 0.22s ease,
          box-shadow 0.22s ease;
      }

      .field:hover .field-number {
        transform: translateY(-2px) rotate(-5deg);
        box-shadow: 0 5px 14px rgba(125, 240, 209, 0.2);
      }

      .field--tugas .field-number {
        background: #d57f54;
      }
      .field--uts .field-number {
        background: #328b91;
      }
      .field--uas .field-number {
        background: #778d48;
      }

      input {
        width: 100%;
        padding: 13px 14px;
        border: 2px solid #303d54;
        border-radius: 11px;
        outline: none;
        color: var(--ink);
        background: #0b1221;
        font: inherit;
        transition:
          border-color 0.2s,
          box-shadow 0.2s,
          background 0.2s,
          transform 0.2s;
      }

      input::placeholder {
        color: #7889a0;
      }
      input:hover {
        border-color: #587078;
        background: #0e1c29;
      }
      input:focus {
        border-color: #7df0d1;
        background: #10252a;
        box-shadow: 0 0 0 4px rgba(125, 240, 209, 0.14);
        transform: translateY(-1px);
      }

      button {
        width: 100%;
        margin-top: 24px;
        padding: 14px 18px;
        border: 0;
        border-radius: 12px;
        color: #fff;
        background: linear-gradient(100deg, #087f78, #159c83, #47b79a);
        box-shadow: 0 8px 22px rgba(21, 156, 131, 0.25);
        font-family: "Shock Surgent", "Oxanium", "Segoe UI", sans-serif;
        font-size: 14px;
        font-weight: 400;
        text-transform: uppercase;
        cursor: pointer;
        transition:
          transform 0.2s,
          box-shadow 0.2s;
        animation: button-breathe 5s ease-in-out infinite;
      }

      button:hover {
        transform: translateY(-3px) scale(1.01);
        box-shadow: 0 11px 24px rgba(21, 156, 131, 0.38);
        animation-play-state: paused;
      }
      button:active {
        transform: translateY(0) scale(0.99);
      }
      button:focus-visible {
        outline: 3px solid var(--yellow);
        outline-offset: 3px;
      }

      #hasil {
        margin-top: 18px;
        padding: 16px;
        border-radius: 12px;
        background: rgba(22, 46, 49, 0.9);
        border-left: 4px solid #7df0d1;
        font-size: 14px;
        font-weight: 700;
        line-height: 1.9;
        transition:
          transform 0.22s ease,
          border-color 0.22s ease,
          background 0.22s ease;
      }

      #hasil:hover {
        transform: translateY(-2px);
        border-left-color: var(--yellow);
        background: rgba(27, 54, 56, 0.96);
      }

      #hasil span {
        font-weight: 800;
      }

      #hasil:empty {
        display: none;
      }

      @keyframes pop-in {
        from {
          opacity: 0;
          transform: translateY(14px) scale(0.98);
        }
        to {
          opacity: 1;
          transform: translateY(0) scale(1);
        }
      }

      @keyframes star-drift {
        0% {
          transform: translate3d(0, 0, 0) scale(1);
        }
        50% {
          transform: translate3d(35px, -24px, 0) scale(1.02);
        }
        100% {
          transform: translate3d(70px, 18px, 0) scale(1);
        }
      }

      @keyframes star-drift-reverse {
        to {
          transform: translate3d(-100px, 60px, 0) rotate(2deg);
        }
      }

      @keyframes star-twinkle {
        from {
          opacity: 0.3;
        }
        to {
          opacity: 0.9;
        }
      }

      @keyframes aurora-flow {
        from {
          transform: translate3d(-4%, -3%, 0) rotate(-12deg) scale(1);
        }
        to {
          transform: translate3d(5%, 4%, 0) rotate(12deg) scale(1.08);
        }
      }

      @keyframes aurora-pulse {
        0%,
        100% {
          filter: drop-shadow(0 0 14px rgba(69, 221, 184, 0.24))
            drop-shadow(0 0 28px rgba(66, 189, 195, 0.12));
          box-shadow:
            0 24px 70px rgba(0, 0, 0, 0.5),
            0 0 17px rgba(69, 221, 184, 0.15),
            0 0 34px rgba(66, 189, 195, 0.08);
        }
        50% {
          filter: drop-shadow(0 0 20px rgba(69, 221, 184, 0.35))
            drop-shadow(0 0 42px rgba(66, 189, 195, 0.18));
          box-shadow:
            0 24px 70px rgba(0, 0, 0, 0.5),
            0 0 22px rgba(69, 221, 184, 0.24),
            0 0 46px rgba(66, 189, 195, 0.12);
        }
      }

      @keyframes card-light-sweep {
        0%,
        70% {
          opacity: 0;
          transform: translateX(-105%);
        }
        74% {
          opacity: 1;
        }
        94%,
        100% {
          opacity: 0;
          transform: translateX(105%);
        }
      }

      @keyframes pattern-float {
        from {
          transform: translate3d(0, 0, 0) rotate(var(--float-rotation));
        }
        to {
          transform: translate3d(18px, -22px, 0)
            rotate(calc(var(--float-rotation) + 4deg));
        }
      }

      @keyframes sparkle-drift {
        0%,
        100% {
          transform: translateY(0) rotate(0deg);
        }
        50% {
          transform: translateY(-3px) rotate(10deg);
        }
      }

      @keyframes title-breathe {
        0%,
        100% {
          text-shadow: 0 0 0 rgba(125, 240, 209, 0);
        }
        50% {
          text-shadow: 0 0 16px rgba(125, 240, 209, 0.12);
        }
      }

      @keyframes button-breathe {
        0%,
        100% {
          box-shadow: 0 8px 22px rgba(21, 156, 131, 0.2);
        }
        50% {
          box-shadow: 0 9px 27px rgba(21, 156, 131, 0.34);
        }
      }

      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          animation-duration: 0.01ms !important;
          animation-iteration-count: 1 !important;
          scroll-behavior: auto !important;
        }
      }

      @media (max-width: 480px) {
        body {
          padding: 20px 14px;
        }
        .card {
          padding: 26px 21px;
          border-radius: 18px;
        }
        h1 {
          column-gap: 0.22em;
          font-size: 32px;
        }
      }

      @media (max-width: 350px) {
        h1 {
          column-gap: 0.17em;
          font-size: 25px;
        }
      }
    </style>
  </head>
  <body>
    <div class="star-dust" aria-hidden="true"></div>
    <div class="aurora-light" aria-hidden="true"></div>
    <div class="aurora-light aurora-light--second" aria-hidden="true"></div>
    <div class="float-pattern float-pattern--one" aria-hidden="true"></div>
    <div class="float-pattern float-pattern--two" aria-hidden="true"></div>
    <div class="float-pattern float-pattern--three" aria-hidden="true"></div>
    <div class="float-pattern float-pattern--four" aria-hidden="true"></div>
    <div class="float-pattern float-pattern--five" aria-hidden="true"></div>
    <div class="card">
      <div class="eyebrow"><span class="sparkle">✦</span> Kalkulator Nilai</div>
      <h1>
        <span class="title-word"
          ><span class="title-urban">H</span
          ><span class="title-shock">itung</span></span
        >
        <span class="title-word"
          ><span class="title-urban">N</span
          ><span class="title-shock">ilai</span></span
        >
        <span class="title-word"
          ><span class="title-urban">A</span
          ><span class="title-shock">khir</span></span
        >
      </h1>
      <p class="intro">
        Masukkan nilai tugas, UTS, dan UAS. Yuk, lihat hasil terbaikmu!
      </p>

      <div class="field field--tugas">
        <label for="tugas"
          ><span class="field-number">01</span> Nilai Tugas</label
        >
        <input
          type="number"
          id="tugas"
          placeholder="0 - 100"
          min="0"
          max="100"
        />
      </div>
      <div class="field field--uts">
        <label for="uts"><span class="field-number">02</span> Nilai UTS</label>
        <input type="number" id="uts" placeholder="0 - 100" min="0" max="100" />
      </div>
      <div class="field field--uas">
        <label for="uas"><span class="field-number">03</span> Nilai UAS</label>
        <input type="number" id="uas" placeholder="0 - 100" min="0" max="100" />
      </div>
      <button onclick="hitungNilai()">Hitung Grade</button>
      <div id="hasil" aria-live="polite"></div>
    </div>

    <script>
      function hitungNilai() {
        let vTugas = parseFloat(document.getElementById("tugas").value) || 0;
        let vUts = parseFloat(document.getElementById("uts").value) || 0;
        let vUas = parseFloat(document.getElementById("uas").value) || 0;

        let nilaiRata = (vTugas + vUts + vUas) / 3;
        let grade = "";
        let status = "";

        if (nilaiRata >= 85) {
          grade = "A";
          status = "LULUS";
        } else if (nilaiRata >= 70) {
          grade = "B";
          status = "LULUS";
        } else if (nilaiRata >= 60) {
          grade = "C";
          status = "LULUS";
        } else {
          grade = "D";
          status = "TIDAK LULUS";
        }

        document.getElementById("hasil").innerHTML =
          `Rata-Rata: ${nilaiRata.toFixed(1)} <br>
         Grade: ${grade} <br>
         Status: <span style="color: ${status === "LULUS" ? "#4ade80" : "#fb7185"}">${status}</span>`;
      }
    </script>
  </body>
  <!-- tarisha ispahan -->
</html>
